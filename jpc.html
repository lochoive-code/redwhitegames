<html lang="zh-TW">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 預先連線至資源伺服器以加速載入 -->
    <link rel="preconnect" href="https://lochoive-code.github.io" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>

    <!-- 載入 Inter 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <!-- 載入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 使用 Inter 字體 */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            overflow-y: auto; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 確保影片作為全螢幕背景 */
        #video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100; 
            object-fit: cover;
            /* 新增影片濾鏡過渡效果 */
            transition: filter 0.5s ease; 
        }

        /* 影片變灰/變暗 */
        .video-dimmed {
            filter: grayscale(80%) brightness(50%);
        }

        /* 內容疊層 */
        #app-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            width: 100%; 
            /* 讓內容在頁面中間 */
            justify-content: center; 
            align-items: center;
            padding: 1rem; 
            transition: opacity 0.3s ease; 
        }

        .text-shadow {
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        }
        
        /* --- 動畫 --- */
        @keyframes pulse-once {
            0% { transform: scale(1); }
            50% { transform: scale(1.01); box-shadow: 0 0 20px rgba(255, 255, 255, 0.6); }
            100% { transform: scale(1); }
        }
        .pulse-once {
            animation: pulse-once 0.8s ease-in-out;
        }
        
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.02); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 3s infinite ease-in-out;
        }
        
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 2s ease-in-out infinite;
        }

        /* --- 卡片 3D 翻轉 --- */
        .card-container {
            perspective: 1000px; 
            position: relative;
            width: 100%;
            height: 100%; 
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        
        .card-container:not(.is-flipped):hover {
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            z-index: 20;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; 
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border-radius: 0.375rem; 
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); 
            padding: 0.25rem; 
        }

        .card-front {
            transform: rotateY(0deg);
            border: 2px solid rgba(255, 255, 255, 0.4); 
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #374151; 
            border: 2px solid #10B981;
            box-shadow: inset 0 0 10px #10B981; 
        }

        .card-container.is-flipped .card-front {
            transform: rotateY(180deg);
        }
        .card-container.is-flipped .card-back {
            transform: rotateY(360deg);
        }
        
        /* --- Grid Layout (核心佈局 - RWD 調整) --- */
        /* 手機版：使用 min-width 強制寬度，配合外層 overflow-scroll 形成滑動效果 */
        #game-board-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr); 
            gap: 0.25rem; 
            width: 100%;
            /* 關鍵 RWD 設定：最小寬度設為 800px，確保在手機上不會擠成一團 */
            min-width: 800px; 
            max-width: 1200px;
        }

        /* 將標頭設定為佔用網格空間 (高度縮小) */
        .category-column-header-cell {
            height: 3.5rem; /* 稍微加高以容納手機版兩行字 */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0.25rem;
            font-weight: 800;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            border-radius: 0.25rem; 
            font-size: 0.875rem;
            line-height: 1.1; /* 緊湊行高 */
        }
        
        /* 確保遊戲板卡片高度一致 */
        #game-board-grid .card-container {
            height: 4.5rem; /* 手機版稍微縮小高度 */
        }
        @media (min-width: 768px) {
             #game-board-grid .card-container {
                height: 5.5rem; 
            }
        }

        /* Modal 樣式 - 確保內容置中且完整呈現 */
        .modal-content-area {
            /* 確保內容可以垂直滾動 */
            max-height: 85vh; /* 留一點空間給邊距 */
            overflow-y: auto; 
            width: 100%;
            /* 自定義捲軸樣式 (Chrome/Safari) */
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.3) transparent;
        }
        /* 隱藏捲軸但在觸控時可用 (Optional aesthetics) */
        .modal-content-area::-webkit-scrollbar {
            width: 6px;
        }
        .modal-content-area::-webkit-scrollbar-thumb {
            background-color: rgba(255,255,255,0.3);
            border-radius: 10px;
        }

        /* 隱藏 Chrome/Safari/Opera 的預設捲軸 (用於橫向滑動區) */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        /* 音樂按鈕特效 */
        .music-btn-pulse {
            animation: pulse-music 2s infinite;
        }
        @keyframes pulse-music {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* 首頁互動區樣式 */
        .home-hover-btn {
            transition: all 0.3s ease;
            transform: translateY(20px);
            opacity: 0;
        }
        
        /* 當滑鼠懸停在父容器 (.group) 時，按鈕的狀態 */
        .group:hover .home-hover-btn {
            transform: translateY(0);
            opacity: 1;
        }

    </style>
</head>

        // --- 本地儲存功能 (LocalStorage) ---
        const STORAGE_KEY = 'RED_WHITE_GAME_STATE';

        function saveGameState() {
            const state = {
                cardData,
                isRedMenuCardFlipped,
                isWhiteMenuCardFlipped,
                currentRedStep,
                currentWhiteStep
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function loadGameState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const state = JSON.parse(saved);
                    // 恢復變數
                    if(state.cardData) cardData = state.cardData;
                    if(state.isRedMenuCardFlipped !== undefined) isRedMenuCardFlipped = state.isRedMenuCardFlipped;
                    if(state.isWhiteMenuCardFlipped !== undefined) isWhiteMenuCardFlipped = state.isWhiteMenuCardFlipped;
                    if(state.currentRedStep !== undefined) currentRedStep = state.currentRedStep;
                    if(state.currentWhiteStep !== undefined) currentWhiteStep = state.currentWhiteStep;
                    return true;
                } catch (e) {
                    console.error("Load Game State Failed", e);
                    return false;
                }
            }
            return false;
        }

            // 確保停止所有音訊和影片（除了背景影片和背景音樂）
            document.querySelectorAll('audio, video').forEach(el => {
                // 排除 background video 和 bg-music

        // 控制背景音樂開關
        window.toggleMusic = function() {
            const audio = document.getElementById('bg-music');
            const btn = document.getElementById('music-toggle-btn');
            const onIcon = document.getElementById('icon-music-on');
            const offIcon = document.getElementById('icon-music-off');
            
            if (audio.paused) {
                // 嘗試播放
                audio.play().then(() => {
                    onIcon.classList.remove('hidden');
                    offIcon.classList.add('hidden');
                    btn.classList.add('music-btn-pulse', 'border-green-400'); // 加入視覺回饋
                    btn.classList.remove('border-gray-500');
                }).catch(e => {
                    console.log("播放失敗", e);
                    alert("無法自動播放音樂，請檢查瀏覽器設定或確認檔案連結有效。");
                });
            } else {
                // 暫停
                audio.pause();
                onIcon.classList.add('hidden');
                offIcon.classList.remove('hidden');
                btn.classList.remove('music-btn-pulse', 'border-green-400');
                btn.classList.add('border-gray-500');
            }
            // 重新渲染圖示
            lucide.createIcons();
        }

        // --- 核心邏輯：卡片翻轉與內容展示 (用於紅白大歌星) ---
        window.flipCard = function(cardId) {
            const card = cardData.find(c => c.id === cardId);
            if (!card) return;

            // 1. 翻轉卡片視覺 (若是第一次)
            if (!card.isFlipped) {
                const cardEl = document.getElementById(`card-${cardId}`);
                if (cardEl) {
                    cardEl.classList.add('is-flipped');
                    card.isFlipped = true;
                    // 保存進度
                    saveGameState();
                }
            }

            // 2. 開啟內容 Modal
            openContentModal(card);
        }

        function openContentModal(card) {
            stopAllAudio(); 

            // --- 新增：進入題目時，強制暫停背景音樂 (避免干擾) ---
            const bgMusic = document.getElementById('bg-music');
            if (bgMusic && !bgMusic.paused) {
                bgMusic.pause();
                // 手動更新左上角音樂按鈕的 UI 為「靜音/暫停」狀態
                const onIcon = document.getElementById('icon-music-on');
                const offIcon = document.getElementById('icon-music-off');
                const btn = document.getElementById('music-toggle-btn');
                
                if (onIcon) onIcon.classList.add('hidden');
                if (offIcon) offIcon.classList.remove('hidden');

        // --- B 類別新增功能：隨機提示觸發邏輯 ---
        window.triggerRandomHint = function(rowIndex) {
            const grid = document.getElementById(`hint-grid-${rowIndex}`);
            if(!grid) return;
            
            // 找出所有內容為 ★ 的方塊 (尚未翻開)
            const unrevealed = Array.from(grid.children).filter(el => el.innerText.trim() === '★');
            
            if (unrevealed.length === 0) {
                // 全部已翻開，可選提示使用者或不做任何事
                return;
            }
            
            // 隨機選取一個
            const randomIndex = Math.floor(Math.random() * unrevealed.length);
            const target = unrevealed[randomIndex];
            
            // 執行翻開動畫與內容更新
            target.innerText = target.dataset.char;
            // 移除星星樣式，改為已翻開樣式
            target.classList.remove('bg-blue-900/50', 'text-yellow-400');
            target.classList.add('bg-white', 'text-blue-900', 'scale-110'); // 短暫放大
            
            // 動畫復原
            setTimeout(() => target.classList.remove('scale-110'), 200);
        }

        // --- 快問快答 專屬邏輯 (保持不變) ---
        window.startFastQa = function(btn, duration) {
            document.getElementById('qa-start-overlay').classList.add('hidden');
            document.getElementById('qa-interaction-area').classList.remove('hidden');
            
            // 新增：觸發音訊播放 (如果有 id="fast-qa-audio")
            const audio = document.getElementById('fast-qa-audio');
            if (audio) {
                audio.play().catch(e => console.log("Audio play failed", e));
            }

            let time = duration;
            const timerEl = document.getElementById('timer-display');
            timerEl.innerText = time;
            
            clearInterval(fastQATimerInterval);
            fastQATimerInterval = setInterval(() => {
                time--;
                timerEl.innerText = time;
                if(time <= 3) timerEl.classList.add('text-red-500', 'timer-active');
                if(time <= 0) {
                    clearInterval(fastQATimerInterval);
                    timerEl.classList.remove('timer-active');
                }
            }, 1000);
        }

        window.handleFastQaOption = function(btn, isCorrect) {
            clearInterval(fastQATimerInterval);
            document.getElementById('qa-interaction-area').classList.add('hidden');
            showFastQaResult(isCorrect);
        }

        // --- 新增：快問快答重試邏輯 (D5) ---
        // 與 checkClassicOption 類似，但會停止計時器並顯示在 qa-success 區塊
        window.checkFastQaRetry = function(btn, isCorrect) {
            const parent = btn.parentElement;
            
            // 清除舊的錯誤提示
            const existingFeedback = parent.querySelector('#error-feedback'); // 注意：這邊 feedback 可能不是 sibling
            if(parent.nextElementSibling && parent.nextElementSibling.id === 'error-feedback') {
                parent.nextElementSibling.remove();
            }

            if (isCorrect) {
                // 答對：停止計時，顯示成功
                clearInterval(fastQATimerInterval);
                
                // 標記按鈕
                btn.classList.add('!bg-green-600', '!border-green-400', 'ring-4', 'ring-green-300', 'scale-105', 'z-10');
                btn.innerHTML += ' <i data-lucide="check-circle" class="inline w-5 h-5 ml-2"></i>';
                
                // 鎖定其他按鈕
                Array.from(parent.children).forEach(child => {
                    child.disabled = true;
                    if (child !== btn) {
                        child.classList.add('opacity-40', 'cursor-not-allowed', 'blur-[1px]');
                    }
                });

                // 顯示結果區塊 (qa-success)
                document.getElementById('qa-result').classList.remove('hidden');
                document.getElementById('qa-success').classList.remove('hidden');
                document.getElementById('qa-success').classList.add('flex');
                document.getElementById('qa-fail').classList.add('hidden');
                
                // 隱藏互動區
                setTimeout(() => {
                     document.getElementById('qa-interaction-area').classList.add('hidden');
                }, 1500); // 稍微延遲讓使用者看到綠色按鈕

            } else {
                // 答錯：不停止計時，僅顯示錯誤
                btn.classList.add('!bg-red-600', '!border-red-400', 'opacity-70', 'cursor-not-allowed');
                btn.disabled = true;

        window.checkClassicOption = function(btn, isCorrect) {
            // 1. 取得父容器 (選項列表)
            const parent = btn.parentElement;
            
            // 2. 清除舊的錯誤提示 (如果有的話)
            const existingFeedback = parent.nextElementSibling;
            if(existingFeedback && existingFeedback.id === 'error-feedback') {
                existingFeedback.remove();
            }

            if (isCorrect) {
                // --- 答對邏輯 ---
                
                // 1. 標記按鈕為綠色
                btn.classList.add('!bg-green-600', '!border-green-400', 'ring-4', 'ring-green-300', 'scale-105', 'z-10');
                btn.innerHTML += ' <i data-lucide="check-circle" class="inline w-5 h-5 ml-2"></i>';

                // 2. 鎖定所有按鈕 (遊戲結束)
                Array.from(parent.children).forEach(child => {
                    child.disabled = true;
                    child.classList.remove('hover:bg-gray-600', 'hover:scale-105'); // 移除 hover 效果
                    if (child !== btn) {
                        child.classList.add('opacity-40', 'cursor-not-allowed', 'blur-[1px]');
                    }
                });

                // 3. 顯示答案區塊
                const answerBox = document.getElementById('answer-box');
                const showAnswerBtn = document.getElementById('show-answer-btn'); 
                
                // 隱藏原本的「看答案」按鈕 (如果是 E/F 類別)
                if(showAnswerBtn) showAnswerBtn.classList.add('hidden');

                // 在答案區塊頂部加入「答對了」標題
                if(!answerBox.querySelector('.success-header')) {
                    const resultHeader = document.createElement('div');
                    resultHeader.className = `success-header text-2xl md:text-4xl font-black mb-4 text-green-400 animate-bounce-slow`;
                    resultHeader.innerHTML = '🎉 答對了！';
                    answerBox.insertBefore(resultHeader, answerBox.firstChild);
                }

                // 顯示
                answerBox.classList.remove('hidden');
                
            } else {
                // --- 答錯邏輯 ---
                
                // 1. 標記按鈕為紅色並禁用 (避免重複點選同一個錯誤答案)
                btn.classList.add('!bg-red-600', '!border-red-400', 'opacity-70', 'cursor-not-allowed');
                btn.disabled = true;

                // 2. 顯示錯誤訊息 (不顯示答案)
                const feedback = document.createElement('div');
                feedback.id = "error-feedback";
                feedback.className = "text-xl font-bold text-red-500 mt-4 bg-black/60 px-6 py-2 rounded-full border border-red-500/50 shadow-lg animate-pulse";
                feedback.innerHTML = '<i data-lucide="alert-circle" class="inline w-5 h-5 mr-2"></i> 答案不正確，請再試一次';
                
                // 插入在選項區域下方
                parent.after(feedback);
            }
            
            // 重新渲染圖示
            lucide.createIcons();
        }

            const cardEl = document.getElementById(`action-card-${id}`);
            if (cardEl) {
                 // 1. 翻轉卡片 (視覺上標記為已選/已翻開) - 保持翻轉狀態，因為背景還是看得到
                if(!cardEl.classList.contains('is-flipped')) {
                    cardEl.classList.add('is-flipped');
                }
            }
            
            // 2. 取得資料
            const action = PUNCH_KING_ACTIONS.find(a => a.id === id);
            if(!action) return;

            // 3. 顯示放大 Modal
            openActionModal(action);
        }

        function openActionModal(action) {
            // 根據陣營設定 Modal 邊框與文字顏色
            let borderClass = 'border-yellow-400';
            let textClass = 'text-yellow-400';
            
            if(action.color === 'red') {
                borderClass = 'border-red-500';
                textClass = 'text-red-500';
            } else if (action.color === 'white') {
                borderClass = 'border-gray-300';
                textClass = 'text-white';
            }

            // 重置並設定 Modal 樣式 (比題目卡片更大，適合展示圖片)
            // 移除舊有的寬度限制，加入新的寬度設定
            modalWrapper.className = `bg-gray-900 text-white rounded-xl shadow-2xl w-full border-4 p-4 transform scale-95 opacity-0 transition-all duration-300 relative flex flex-col max-h-[95vh] ${borderClass} max-w-5xl`; // max-w-5xl for larger image

            // 隱藏 Menu Modal 的 Home 按鈕
            modalCloseHomeBtn.classList.add('hidden');

            const content = `
                <div class="relative w-full h-full flex flex-col items-center justify-center">
                    <!-- 關閉按鈕 -->
                    <button onclick="closeContentModal()" class="absolute top-0 right-0 md:-top-2 md:-right-2 text-gray-400 hover:text-white transition z-50 bg-black/50 rounded-full p-1">
                        <i data-lucide="x-circle" class="w-10 h-10"></i>
                    </button>

                    <div class="flex items-center justify-center space-x-4 mb-4">
                        <span class="text-6xl md:text-7xl animate-bounce-slow">${action.emoji}</span>
                        <h3 class="text-4xl md:text-6xl font-black ${textClass} tracking-widest">
                            ${action.name}
                        </h3>
                    </div>
                    
                    <div class="w-full flex-1 flex items-center justify-center mb-6 overflow-hidden min-h-0">
                        <img src="${action.actionImage}" loading="lazy" decoding="async"
                             class="max-h-[60vh] w-auto object-contain rounded-xl border-4 ${borderClass} shadow-2xl" 
                             alt="${action.name} 動作示範"
                             onerror="this.onerror=null; this.src='https://placehold.co/400x600/4B5563/ffffff?text=圖片載入失敗'">
                    </div>

                    <div class="bg-gray-800/80 p-4 rounded-xl border border-gray-600 w-full text-center">
                        <p class="text-xl md:text-3xl text-white font-bold leading-relaxed">
                            ${action.instruction}
                        </p>
                    </div>
                </div>
            `;

            modalContent.innerHTML = content;
            gameModal.classList.remove('hidden');
            
            // 動畫
            setTimeout(() => {
                modalWrapper.classList.remove('scale-95', 'opacity-0');
                modalWrapper.classList.add('scale-100', 'opacity-100');
            }, 10);
            
            lucide.createIcons();
        }

        /**
         * 渲染紅白拳王爭霸戰的動作教學板 (根據使用者圖片設計)
         */
        window.renderRedBallActionTutorial = function() {
            setVideoBackground(VIDEO_URLS.GAME);
            
            // 確保遊戲模式下影片變暗
            document.getElementById('video-background').classList.add('video-dimmed');
            dimmingOverlay.classList.remove('opacity-0');
            dimmingOverlay.classList.add('opacity-60');

            // 根據 PUNCH_KING_ACTIONS 資料生成卡片 HTML
            const actionCardsHtml = PUNCH_KING_ACTIONS.map((action, index) => {
                // 根據陣營設定顏色
                // 注意：這裡 'white' 的 card-front 顏色是 bg-white text-gray-900，要和 'red' 區分
                const bg = action.color === 'red' ? 'bg-red-600' : (action.color === 'white' ? 'bg-white text-gray-900' : 'bg-yellow-500 text-gray-900');
                const border = action.color === 'red' ? 'border-red-400' : (action.color === 'white' ? 'border-gray-400' : 'border-yellow-400');
                
                return `
                    <div id="action-card-${action.id}" class="card-container h-[400px]" onclick="flipActionCard(${action.id})">
                        <!-- Front Face: Name and Flip Button -->
                        <div class="card-face card-front ${bg} p-6 border-4 ${border} hover:shadow-2xl">
                            <span class="text-7xl md:text-8xl">${action.emoji}</span>
                            <div class="mt-6 text-center">
                                <p class="text-3xl md:text-4xl font-black">${action.name}</p>
                                <button class="mt-4 px-4 py-2 bg-black/30 rounded-full font-bold transition text-white hover:bg-black/50">
                                    點擊翻牌
                                </button>
                            </div>
                        </div>

                        <!-- Back Face: Image and Instruction (已優化為直式佈局) -->
                        <div class="card-face card-back bg-gray-900/90 p-4 border-4 ${border} overflow-hidden">
                            <div class="flex flex-col items-center justify-start w-full h-full text-center py-2">
                                <img src="${action.actionImage}" loading="lazy" decoding="async"
                                     class="w-full h-auto max-h-48 md:max-h-64 object-contain rounded-lg border-2 ${border} mb-4 shadow-lg" 
                                     alt="動作示範圖: ${action.name}"
                                     onerror="this.onerror=null; this.src='https://placehold.co/200x300/4B5563/ffffff?text=直式圖片載入失敗'">
                                
                                <div class="p-2 w-full text-center border-t border-gray-700 pt-3 flex-1 flex items-center justify-center">
                                    <!-- 簡化為一句話 -->
                                    <p class="text-base md:text-lg font-semibold text-white">${action.instruction}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            appContainer.innerHTML = `
                <div class="w-full flex flex-col items-center py-10 relative min-h-screen px-4">
                    
                    <!-- 新增：返回首頁按鈕 -->
                    <button onclick="renderHomePage()" class="absolute top-4 right-4 z-20 px-3 py-1 bg-gray-800/80 hover:bg-gray-700 text-white rounded-lg text-sm border border-gray-600 shadow-lg transition flex items-center space-x-1">
                        <i data-lucide="home" class="w-4 h-4"></i>
                        <span>首頁</span>
                    </button>
                    
                    <!-- 拳王動作教學 標題 -->
                    <div class="bg-black/80 rounded-full px-6 py-3 mb-10 shadow-2xl flex items-center animate-bounce-slow">
                        <span class="text-2xl md:text-3xl font-black text-white flex items-center">
                            <span class="text-red-500 text-5xl md:text-6xl mr-3 leading-none">🔴</span> 拳王動作教學
                        </span>
                    </div>

                    <!-- 三張動作卡片 (使用 sm:grid-cols-3 確保手機上直列，桌面橫列) -->
                    <div class="w-full max-w-5xl grid grid-cols-1 sm:grid-cols-3 gap-6 mb-12">
                        ${actionCardsHtml}
                    </div>

                    <!-- 底部導航 (放在卡片下方，不會遮擋) -->
                    <div class="mt-4 flex space-x-4">
                        <button onclick="navigateTo(() => renderRedBallTutorialSteps(${RED_BALL_STEPS.length - 1}))" class="px-6 py-3 bg-gray-700/50 hover:bg-gray-700 text-white rounded-full text-lg border border-gray-600 transition transform hover:scale-105">
                            <i data-lucide="arrow-left" class="w-5 h-5 inline-block mr-2"></i> 返回流程說明
                        </button>
                        <!-- 新增：直接返回遊戲選單按鈕 -->
                        <button onclick="navigateTo(renderMenu)" class="px-6 py-3 bg-gray-700/50 hover:bg-gray-700 text-white rounded-full text-lg border border-gray-600 transition transform hover:scale-105">
                            <i data-lucide="layout-grid" class="w-5 h-5 inline-block mr-2"></i> 返回遊戲選單
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }


        /**
         * 處理白色球步驟導航：切換當前步驟並重新渲染
         * @param {number} direction - 1 for next, -1 for previous
         */
        window.changeWhiteStep = function(direction) {
            const newStep = currentWhiteStep + direction;
            if (newStep >= 0 && newStep < WHITE_BALL_STEPS.length) {
                renderWhiteBallTutorialSteps(newStep);
                // 保存進度
                saveGameState();
            } else if (newStep >= WHITE_BALL_STEPS.length) {
                // 最後一步按「下一步」則導向主板
                navigateTo(renderWhiteBallBoard);
            }
        }

        /**
         * 渲染白色球步驟引導卡片 (紅白大歌星)
         * @param {number} stepIndex - 要顯示的步驟索引 (0-based)
         */
        window.renderWhiteBallTutorialSteps = function(stepIndex) {
            setVideoBackground(VIDEO_URLS.GAME);
            
            // 確保遊戲模式下影片變暗
            document.getElementById('video-background').classList.add('video-dimmed');
            dimmingOverlay.classList.remove('opacity-0');
            dimmingOverlay.classList.add('opacity-60');

            currentWhiteStep = stepIndex;

            const step = WHITE_BALL_STEPS[currentWhiteStep];
            const totalSteps = WHITE_BALL_STEPS.length;
            
            const prevDisabled = currentWhiteStep === 0;
            // 最後一步按鈕變成 "開始遊戲"
            const nextButtonText = currentWhiteStep === totalSteps - 1 ? '開始遊戲' : '下一步';
            const nextButtonIcon = currentWhiteStep === totalSteps - 1 ? 'play' : 'arrow-right';
            const nextButtonColor = currentWhiteStep === totalSteps - 1 ? 'bg-green-600 hover:bg-green-700' : 'bg-yellow-500 hover:bg-yellow-400 text-gray-900';


            appContainer.innerHTML = `
                <div class="w-full max-w-lg md:max-w-xl mx-auto flex flex-col items-center justify-center py-10 min-h-screen relative px-4">
                    
                    <!-- 新增：返回首頁按鈕 -->
                    <button onclick="renderHomePage()" class="absolute top-4 right-4 z-20 px-3 py-1 bg-gray-800/80 hover:bg-gray-700 text-white rounded-lg text-sm border border-gray-600 shadow-lg transition flex items-center space-x-1">
                        <i data-lucide="home" class="w-4 h-4"></i>
                        <span>首頁</span>
                    </button>
                    
                    <!-- 步驟導覽卡片 (符合截圖主體) -->
                    <div class="w-full bg-gray-800/90 rounded-xl shadow-2xl p-6 md:p-8 border border-gray-700 mb-8 flex flex-col items-center transition transform pulse-once">
                        
                        <!-- 頂部資訊 -->
                        <div class="text-center mb-8">
                            <div class="flex items-center justify-center text-gray-300 mb-2">
                                <i data-lucide="disc" class="w-4 h-4 mr-2 text-white"></i>
                                <span class="text-lg md:text-xl font-bold">遊戲流程說明 (${currentWhiteStep + 1}/${totalSteps})</span>
                            </div>
                            <h2 class="text-base md:text-lg font-semibold text-red-400">
                                紅白大歌星 (搶答模式)
                            </h2>
                        </div>

                        <!-- 步驟內容卡片 (更深色背景，符合截圖中的內層卡片) -->
                        <div class="w-full bg-gray-900/70 p-6 md:p-8 rounded-lg mb-8 shadow-xl">
                            <h3 class="text-2xl md:text-3xl font-black text-yellow-500 mb-4 text-center">
                                Step ${currentWhiteStep + 1} | ${step.title}
                            </h3>
                            <p class="text-base md:text-lg text-gray-300 text-center whitespace-pre-line">${step.description}</p>
                        </div>

                        <!-- 導航按鈕 -->
                        <div class="flex justify-center space-x-4 w-full">
                            <!-- 上一步按鈕 -->
                            <button 
                                onclick="changeWhiteStep(-1)" 
                                class="flex-1 max-w-[150px] px-6 py-3 rounded-full font-bold transition transform ${prevDisabled ? 'bg-gray-700 text-gray-500 cursor-not-allowed' : 'bg-gray-700 hover:bg-gray-600 text-white hover:scale-105'}"
                                ${prevDisabled ? 'disabled' : ''}>
                                <i data-lucide="arrow-left" class="w-4 h-4 inline-block mr-1"></i> 上一步
                            </button>
                            
                            <!-- 下一步按鈕 -->
                            <button 
                                onclick="changeWhiteStep(1)" 
                                class="flex-1 max-w-[150px] px-6 py-3 rounded-full font-bold transition transform hover:scale-105 ${nextButtonColor}">
                                <i data-lucide="${nextButtonIcon}" class="w-4 h-4 inline-block mr-1"></i> ${nextButtonText}
                            </button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }


        // 紅白大歌星 遊戲主板 (已更新 Home 按鈕樣式)
        function renderWhiteBallBoard() {
            setVideoBackground(VIDEO_URLS.GAME);
            
            // 確保遊戲模式下影片變暗
            document.getElementById('video-background').classList.add('video-dimmed');
            dimmingOverlay.classList.remove('opacity-0');
            dimmingOverlay.classList.add('opacity-60');

            // --- 修改：僅在 cardData 為空時初始化，若已有資料(已載入)則不重置 ---
            if (cardData.length === 0) {
                let idCounter = 1;
                for (let col = 0; col < CATEGORY_COLORS.length; col++) {
                    for (let row = 0; row < ROW_COUNT; row++) {
                        cardData.push({ 
                            id: idCounter++, 
                            col, 
                            row, 
                            isFlipped: false 
                        });
                    }
                }
            }
            
            let gridHtml = '';
            
            // 1. Header (佔用 6 個欄位)
            gridHtml += CATEGORY_COLORS.map(cat => `
                <div class="category-column-header-cell ${cat.header_bg} ${cat.text} shadow-lg border-b-4 border-black/20">
                    <div class="flex flex-col items-center">
                        <i data-lucide="${cat.icon}" class="w-4 h-4 mb-0.5 hidden md:block"></i> <!-- 手機版隱藏 icon 省空間 -->
                        <span>${cat.name}</span>
                    </div>
                </div>
            `).join('');

            // 2. Cards (6 x 5 = 30 張)
            for (let row = 0; row < ROW_COUNT; row++) {
                for (let col = 0; col < CATEGORY_COLORS.length; col++) {
                    const card = cardData.find(c => c.col === col && c.row === row);
                    const cat = CATEGORY_COLORS[col];
                    const label = `${CATEGORY_LETTERS[col]}${row + 1}`;
                    
                    // 新增：根據 isFlipped 狀態加上 class
                    const flippedClass = card.isFlipped ? 'is-flipped' : '';

                    // Grid Item: 佔用 1 欄位
                    gridHtml += `
                        <div id="card-${card.id}" class="card-container ${flippedClass}" onclick="flipCard(${card.id})">
                            <div class="card-face card-front ${cat.bg} ${cat.text} hover:${cat.hover} transition duration-300">
                                <span class="text-xl md:text-3xl font-black drop-shadow-md">${label}</span>
                            </div>
                            <div class="card-face card-back">
                                <i data-lucide="check" class="w-6 h-6 md:w-8 md:h-8 text-green-400"></i>
                                <span class="text-xs font-bold text-green-400 mt-1">Done</span>
                            </div>
                        </div>
                    `;
                }
            }

            // RWD 修改：加入 overflow-x-auto 容器
            appContainer.innerHTML = `
                <div class="w-full flex flex-col items-center max-w-7xl pt-4 px-2 relative h-full justify-center"> <!-- 加上 relative 讓 Home 按鈕定位 -->
                    <!-- Home button fixed to the top right of the container (使用新的樣式) -->
                    <button onclick="renderHomePage()" class="absolute top-2 right-2 md:top-4 md:right-4 z-20 px-3 py-1 bg-gray-800/80 hover:bg-gray-700 text-white rounded-lg text-sm border border-gray-600 shadow-lg transition flex items-center space-x-1">
                        <i data-lucide="home" class="w-4 h-4"></i>
                        <span>首頁</span>
                    </button>
                    
                    <!-- Centered Title (新風格) -->
                    <div class="bg-black/80 rounded-full px-6 md:px-8 py-2 md:py-3 mb-4 md:mb-6 shadow-2xl flex items-center animate-bounce-slow mt-8 md:mt-0">
                        <span class="text-2xl md:text-4xl font-black text-white flex items-center">
                            <span class="text-red-500 text-4xl md:text-6xl mr-2 md:mr-3 leading-none">⚪</span> 紅白大歌星
                        </span>
                    </div>
                    
                    <p class="text-gray-300 text-xs md:text-sm mb-3 text-shadow text-center">
                        <span class="md:hidden text-yellow-400 animate-pulse">← 左右滑動查看所有題目 →</span><br class="md:hidden">
                        30 張卡片等待你的選擇，翻開一張，開啟驚喜！
                    </p>

                    <!-- RWD 重點：包覆層加上水平捲軸 -->
                    <div class="w-full overflow-x-auto pb-4 hide-scrollbar px-1">
                        <div id="game-board-grid" class="mb-4 mx-auto">
                            ${gridHtml}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // 啟動: 變更為先渲染首頁，並設定背景音樂音量
        window.onload = function() {
            // 嘗試載入遊戲進度
            const hasSavedData = loadGameState();
            if (hasSavedData) {
                console.log("已恢復遊戲進度");
            }

            const bgAudio = document.getElementById('bg-music');
            if(bgAudio) {
                bgAudio.volume = 0.5; // 設定音量為 50%
            }
            renderHomePage();
        };

    </script>
</body>
</html>
